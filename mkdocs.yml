site_name: Spring Boot Mastery Path
site_description: A structured, module-wise Spring Boot program for Java developers — REST APIs, Spring Data JPA, security, testing, messaging, observability, and production services.
site_url: https://sigilipelli.github.io/spring-boot-mastery-path/
repo_url: https://github.com/sigilipelli/spring-boot-mastery-path
repo_name: spring-boot-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Spring and Spring Boot Actually Are": level-1/01-what-is-spring-boot.md
      - "02 · Spring Initializr & Project Structure": level-1/02-initializr-project-structure.md
      - "03 · Dependency Injection & the IoC Container": level-1/03-dependency-injection-ioc.md
      - "04 · Beans, Scopes & Component Scanning": level-1/04-beans-component-scanning.md
      - "05 · Configuration: application.yml, Profiles & @ConfigurationProperties": level-1/05-configuration-profiles.md
      - "06 · Building REST Controllers": level-1/06-rest-controllers.md
      - "07 · Request Binding, Responses & Validation": level-1/07-request-response-validation.md
      - "08 · Exception Handling with @ControllerAdvice & ProblemDetail": level-1/08-exception-handling.md
      - "09 · Logging with SLF4J & Logback": level-1/09-logging.md
      - "10 · Project — A Task Tracker REST API": level-1/10-project-task-api.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Spring Data JPA & Hibernate Basics": level-2/01-spring-data-jpa-basics.md
